

book:
    library:
        path: /tmp
        uploads: ${book.library.path}/uploads

logging.level:
    root: INFO
    com.martinia.indigo: DEBUG

data:
    initializer:
        books:
            recommendations: 20
        metadata:
            pull: 1000
        user:
            admin:
                password: $2a$10$U47NDeBbqVmBHQsYXh8HI.IpxGiopQ0cWgXTkwU/AwFmGRf5l9lfq
                username: admin
    author:
        default-image: https://s.gr-assets.com/assets/nophoto/user/u_200x266-e183445fd1a1b5cc7075bb1cf7043306.png

jwt:
    criptKey: '&8e#tGj$45JSGSma'
    expiration: 36000000

server:
    max-http-header-size: 40KB
    port: 8080

cors:
    allowed-origin-patterns: http://localhost:4200

spring:
    main:
        allow-circular-references: true
    data:
        mongodb:
            auto-index-creation: true
            database: indigo
            host: localhost
            port: ${mongodb.container.port}
    datasource:
        driver-class-name: org.sqlite.JDBC
        initialSize: 1
        jdbcUrl: ${spring.datasource-calibre.url}
        maxActive: 1
        maxIdle: 1
        password: ''
        url: jdbc:sqlite:/${book.library.path}/metadata.db
        username: ''
    jpa:
        properties:
            hibernate:
                dialect: org.hibernate.dialect.SQLiteDialect
    mail:
        properties:
            mail:
                smtp:
                    auth: true
                    connectiontimeout: 5000
                    starttls:
                        enable: true
                    timeout: 5000
                    writetimeout: 5000

flags:
    amazon: true
    goodreads-reviews: true
    wikipedia: true
    google: true
    openlibrary: true
    libretranslate: true

metadata:
    reviews:
        queue:
            worker-enabled: false
    goodreads:
        url: https://www.goodreads.com
        reviews: ${metadata.goodreads.url}/search?q=$title+$author&search_type=books
    google:
        url: https://www.googleapis.com/books/v1/volumes?q=intitle:$title
    openlibrary:
        books: https://openlibrary.org/search.json?title=$title&author=$author&fields=key,title,author_name,edition_key,ratings_average,ratings_count,cover_i&limit=5
        books-by-isbn: https://openlibrary.org/search.json?isbn=$isbn&fields=key,title,author_name,edition_key,ratings_average,ratings_count&limit=5
        authors: https://openlibrary.org/search/authors.json?q=$subject&limit=5
        author-info: https://openlibrary.org/authors/$id.json
        author-image: https://covers.openlibrary.org/a/olid/$id-L.jpg?default=false
        dumps:
            editions-url: https://openlibrary.org/data/ol_dump_editions_latest.txt.gz
            ratings-url: https://openlibrary.org/data/ol_dump_ratings_latest.txt.gz
            storage-path: /tmp/indigo-test/openlibrary
            minimum-free-space-bytes: 0
            delete-downloads-on-success: true
    libretranslate:
        url: http://192.168.1.40:6000
    amazon:
        url: https://www.amazon.es
        asin: ${metadata.amazon.url}/s?k=$title+$author&i=stripbooks
        reviews: ${metadata.amazon.url}/dp/$asin
    wikipedia:
        url: https://$lang.wikipedia.org
        author: ${metadata.wikipedia.url}/w/api.php?action=query&format=json&list=search&utf8=1&origin=*&srsearch=$subject
        author-info: ${metadata.wikipedia.url}/w/api.php?format=json&action=query&prop=extracts|pageimages&exintro&explaintext&generator=search&gsrlimit=1&redirects=1&piprop=original&gsrsearch=$subject
    unsplash:
        url: https://unsplash.com/es/s/fotos/$term
