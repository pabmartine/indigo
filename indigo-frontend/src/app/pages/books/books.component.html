<p-toast position="top-center" [showTransformOptions]="'translateY(-100%)'"></p-toast>
<p-card>
<div class="books-page-container">

  <!-- Favorites Section -->
  <div *ngIf="favorites && favorites.length > 0">
    <h2 class="section-title">{{'locale.books.favorites.title' | translate}}</h2>
    <div class="books-grid" infiniteScroll [infiniteScrollDistance]="2" (scrolled)="onScroll()">
      <div *ngFor="let book of favorites; trackBy: trackByBookId" class="book-item" (click)="showDetails(book)">
        <div class="book-cover-container">
          <img [src]="book.image || './assets/images/book-placeholder.jpg'" class="book-cover" alt="{{ book.title }}"/>
        </div>
        <div class="book-info">
          <span class="title" title="{{ book.title }}">{{book.title || 'Unknown Title'}}</span>
          <span class="subtitle">
            <a href="javascript:;" (click)="openAuthor(getFirstAuthor(book)); $event.stopPropagation();" *ngIf="getFirstAuthor(book) !== 'Unknown Author'">
              {{getFirstAuthor(book)}}
            </a>
            <span *ngIf="getFirstAuthor(book) === 'Unknown Author'">{{getFirstAuthor(book)}}</span>
          </span>
          <div *ngIf="book.rating" class="rating-container">
            <p-rating [ngModel]="book.rating" readonly="true" stars="5" [cancel]="false"></p-rating>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- All Books Section -->
  <div>
    <div class="books-header">
      <span class="page-title">{{title || 'Books'}}</span>
      <p-dropdown [options]="sorts || []" [(ngModel)]="selectedSort" (onChange)="onChange($event)" class="sortBy" *ngIf="sorts && sorts.length > 0">
        <ng-template let-item pTemplate="selectedItem">
          <span>{{item?.label || 'Sort Option'}}</span>
        </ng-template>
      </p-dropdown>
    </div>

    <div class="books-grid" infiniteScroll [infiniteScrollDistance]="2" (scrolled)="onScroll()">
      <div *ngFor="let book of books || []; trackBy: trackByBookId" class="book-item" (click)="showDetails(book)">
        <div class="book-cover-container">
          <img [src]="book.image || './assets/images/book-placeholder.jpg'" class="book-cover" alt="{{ book.title }}"/>
        </div>
        <div class="book-info">
          <span class="title" title="{{ book.title }}">{{book.title || 'Unknown Title'}}</span>
          <span class="subtitle">
             <a href="javascript:;" (click)="openAuthor(getFirstAuthor(book)); $event.stopPropagation();" *ngIf="getFirstAuthor(book) !== 'Unknown Author'">
              {{getFirstAuthor(book)}}
            </a>
            <span *ngIf="getFirstAuthor(book) === 'Unknown Author'">{{getFirstAuthor(book)}}</span>
          </span>
          <div *ngIf="book.rating" class="rating-container">
            <p-rating [ngModel]="book.rating" readonly="true" stars="5" [cancel]="false"></p-rating>
            <i class="pi pi-comments" *ngIf="book.reviews" (click)="showDetails(book); $event.stopPropagation();"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button type="button" pButton [ngClass]="'up-button'" *ngIf="showGoUpButton" (click)="scrollTop()" icon="pi pi-arrow-up" aria-label="Scroll to top"></button>

</div>
</p-card>
<!-- Dialogs -->
<p-dialog [(visible)]="showDetail" [modal]="true" [draggable]="false" [resizable]="false" [transitionOptions]="'150ms'" [closeOnEscape]="true">
  <app-detail (eventClose)="closeDetails()" (eventOpen)="openDetails()" (eventAuthor)="openAuthor($event)" (eventBook)="refreshBook($event)" (deleteBookEvent)="deleteBook($event)"></app-detail>
</p-dialog>

<p-dialog [(visible)]="showAuthorDetail" [modal]="true" [draggable]="false" [resizable]="false" [transitionOptions]="'150ms'" [closeOnEscape]="true">
  <app-author (eventClose)="closeAuthorDetails()" (eventOpen)="openAuthorDetails()" (eventBook)="openBook($event)"></app-author>
</p-dialog>
