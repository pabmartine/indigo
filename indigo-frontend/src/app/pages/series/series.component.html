<p-toast position="top-center" [showTransformOptions]="'translateY(-100%)'"></p-toast>

<p-card>
  <div class="content-header p-grid">
    <div class="p-col-12 p-md-6">
      <span class="page-title">
        {{title}}
      </span>
    </div>
    <div class="p-col-12 p-md-6" style="text-align: right;">
      <p-dropdown [options]="sorts" [(ngModel)]="selectedSort" (onChange)="onChange($event)" class="sortBy" *ngIf="sorts && sorts.length > 0">
        <ng-template let-item pTemplate="selectedItem">
          <span style="vertical-align:middle">{{item?.label || 'Sort Option'}}</span>
        </ng-template>
        <ng-template let-item pTemplate="item">
          <span>{{item?.label || 'Unknown'}}</span>
        </ng-template>
      </p-dropdown>
    </div>
  </div>

  <!-- Series grid -->
  <div class="series-grid">
    <div class="serie-item"
         *ngFor="let serie of series; trackBy: trackBySerieId">
      <div class="stack twisted">
        <img [appLazyImage]="serie.image"
             [lazySource]="serie.originalImage"
             [lazyPlaceholder]="'./assets/images/unknown.jpg'"
             (lazyLoaded)="serie.image = $event"
             class="list-image"
             (click)="getBooksBySerie(serie.name)"
             style="cursor: pointer;"
             (error)="serie.image = './assets/images/unknown.jpg'"
             [alt]="serie.name" />
      </div>
      <div class="center">
        <a href="javascript:;"
           (click)="getBooksBySerie(serie.name)"
           style="cursor: pointer;"
           tabindex="0"
           (keyup.enter)="getBooksBySerie(serie.name)">
          <span class="title">{{serie.name}}</span>
          <span class="subtitle">{{serie.numBooks}} {{'locale.series.total' | translate}}</span>
        </a>
      </div>
    </div>
  </div>

  <div #scrollSentinel class="scroll-sentinel" aria-hidden="true" style="height: 20px;"></div>
</p-card>
