<p-toast position="top-center" [showTransformOptions]="'translateY(-100%)'"></p-toast>
<div class="book">
<p-card>
<div class="books-page-container">

  <!-- Recommendations Section -->
  <div>
    <div class="books-header">
      <span class="page-title">{{title || 'Recommendations'}}</span>
      <div class="view-controls">
        <p-dropdown [options]="sorts || []" [(ngModel)]="selectedSort" (onChange)="onChange($event)" class="sortBy" *ngIf="sorts && sorts.length > 0">
          <ng-template let-item pTemplate="selectedItem">
            <span>{{item?.label || 'Sort Option'}}</span>
          </ng-template>
          <ng-template let-item pTemplate="item">
            <span>{{item?.label || 'Unknown'}}</span>
          </ng-template>
        </p-dropdown>
      </div>
    </div>

    <!-- Loading state -->
    <div *ngIf="isLoading" class="loading-container">
      <span class="loading">{{'locale.search.searching' | translate}}</span>
    </div>

    <!-- Books Grid -->
    <div *ngIf="!isLoading && books && books.length > 0" class="books-grid">
      <div *ngFor="let book of books; trackBy: trackByBookId" class="book-item" (click)="showDetails(book)">
        <div class="book-cover-container">
          <img [src]="book.image || './assets/images/unknown.jpg'" class="book-cover" alt="{{ book.title }}"/>
        </div>
        <div class="book-info">
          <span class="title" title="{{ book.title }}">{{book.title || 'Unknown Title'}}</span>
          <span class="subtitle">
            <a href="javascript:;" (click)="openAuthor(book.authors[0]); $event.stopPropagation();" *ngIf="book.authors && book.authors[0]">
              {{book.authors[0]}}
            </a>
            <span *ngIf="!book.authors || !book.authors[0]">Unknown Author</span>
          </span>
          <div *ngIf="book.rating" class="rating-container">
            <p-rating [ngModel]="book.rating" readonly="true" stars="5" [cancel]="false"></p-rating>
            <i class="pi pi-comments" *ngIf="book.reviews" (click)="showDetails(book); $event.stopPropagation();"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div *ngIf="!isLoading && (!books || books.length === 0)" class="empty-state">
      <p>{{'locale.books.recommendations.empty' | translate}}</p>
    </div>
  </div>

  <button type="button" pButton [ngClass]="'up-button'" *ngIf="showGoUpButton" (click)="scrollTop()" icon="pi pi-arrow-up" aria-label="Scroll to top"></button>

</div>
</p-card>
</div>

<!-- Dialogs -->
<p-dialog [(visible)]="showDetail" [modal]="true" [draggable]="false" [resizable]="false" [transitionOptions]="'150ms'" [closeOnEscape]="true" appendTo="body">
  <app-detail (eventClose)="closeDetails()" (eventOpen)="openDetails()" (eventAuthor)="openAuthor($event)"></app-detail>
</p-dialog>

<p-dialog [(visible)]="showAuthorDetail" [modal]="true" [draggable]="false" [resizable]="false" [transitionOptions]="'150ms'" [closeOnEscape]="true" appendTo="body">
  <app-author (eventClose)="closeAuthorDetails()" (eventOpen)="openAuthorDetails()" (eventBook)="openBook($event)"></app-author>
</p-dialog>
