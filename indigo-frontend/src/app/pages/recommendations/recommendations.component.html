<p-toast position="top-center" [showTransformOptions]="'translateY(-100%)'"></p-toast>

<div class="book">
  <p-card>
    <div class="content-header p-grid">
      <div class="p-col-12 p-md-6">
        <span class="page-title">
          {{title}}
        </span>
      </div>
      <div class="p-col-12 p-md-6" style="text-align: right;">
        <p-dropdown [options]="sorts"
                    [(ngModel)]="selectedSort"
                    (onChange)="onChange($event)"
                    class="sortBy">
          <ng-template let-item pTemplate="selectedItem">
            <span style="vertical-align:middle">{{item.label}}</span>
          </ng-template>
        </p-dropdown>
      </div>
    </div>

    <!-- Loading state -->
    <div *ngIf="isLoading" class="loading-container">
      <span class="loading">{{'locale.search.searching' | translate}}</span>
    </div>

    <!-- Books grid -->
    <div class="content-body p-grid"
         infiniteScroll
         [infiniteScrollDistance]="2"
         (scrolled)="onScroll()"
         *ngIf="!isLoading && books && books.length > 0">
      <div class="p-sm-6 p-md-4 p-lg-2 p-xl-1"
           *ngFor="let book of books; trackBy: trackByBookId">

        <img [src]="book.image || './assets/images/book-placeholder.jpg'"
             height="225"
             class="list-image"
             (click)="showDetails(book)"
             style="cursor: pointer;"
             loading="lazy"
             [alt]="book.title"
             [class.loading-image]="!book.image" />

        <div>
          <span class="title">{{book.title}}</span>
        </div>

        <div>
          <span class="subtitle">
            <a href="javascript:;"
               (click)="openAuthor(book.authors[0])"
               style="cursor: pointer;"
               tabindex="0"
               (keyup.enter)="openAuthor(book.authors[0])">{{book.authors[0]}}</a>
          </span>
        </div>

        <div *ngIf="book.rating">
          <p-rating [ngModel]="book.rating"
                    readonly="true"
                    stars="5"
                    [cancel]="false"
                    style="display: inline-block;"></p-rating>
          <i class="pi pi-comments"
             style="float: right; color: burlywood"
             *ngIf="book.reviews"></i>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div *ngIf="!isLoading && (!books || books.length === 0)" class="empty-state">
      <p>{{'locale.books.recommendations.empty' | translate}}</p>
    </div>

    <button type="button"
            pButton
            [ngClass]="'up-button'"
            *ngIf="showGoUpButton"
            (click)="scrollTop()"
            icon="pi pi-arrow-up"
            aria-label="Scroll to top"></button>
  </p-card>
</div>

<div class="book">
  <p-dialog [(visible)]="showDetail"
            [modal]="true"
            [draggable]="false"
            [resizable]="false"
            [transitionOptions]="'150ms'"
            [closeOnEscape]="true">
    <app-detail (eventClose)="closeDetails()"
                (eventOpen)="openDetails()"
                (eventAuthor)="openAuthor($event)"></app-detail>
  </p-dialog>

  <p-dialog [(visible)]="showAuthorDetail"
            [modal]="true"
            [draggable]="false"
            [resizable]="false"
            [transitionOptions]="'150ms'"
            [closeOnEscape]="true">
    <app-author (eventClose)="closeAuthorDetails()"
                (eventOpen)="openAuthorDetails()"
                (eventBook)="openBook($event)"></app-author>
  </p-dialog>
</div>
