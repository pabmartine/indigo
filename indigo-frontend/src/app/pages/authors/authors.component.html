<p-toast position="top-center" [showTransformOptions]="'translateY(-100%)'"></p-toast>

<div class="author" *ngIf="favorites?.length > 0">
  <p-card>
    <div class="content-header p-grid">
      <div class="p-col-12 p-md-6">
        <span class="page-title">
          {{'locale.authors.favorites.title' | translate}}
        </span>
      </div>
    </div>

    <div class="content-body p-grid">
      <div class="p-sm-6 p-md-4 p-lg-2 p-xl-1"
           *ngFor="let author of favorites; trackBy: trackByAuthorId">
        <div class="user_avatar">
          <img [src]="author.image || './assets/images/avatar3.jpg'"
               class="avatar"
               (click)="showDetails(author)"
               style="cursor: pointer;"
               loading="lazy"
               [alt]="author.name"
               [class.loading-image]="!author.image" />

          <a href="javascript:;"
             (click)="showDetails(author)"
             style="cursor: pointer;"
             tabindex="0"
             (keyup.enter)="showDetails(author)">
            <span class="title">{{author.name}}</span>
            <span class="subtitle">{{author.numBooks}} {{'locale.authors.total' | translate}}</span>
          </a>
        </div>
      </div>
    </div>
  </p-card>
</div>

<div class="author">
  <p-card>
    <div class="content-header p-grid">
      <div class="p-col-12 p-md-6">
        <span class="page-title">
          {{title}}
        </span>
      </div>
      <div class="p-col-12 p-md-6" style="text-align: right;">
        <p-dropdown [options]="sorts"
                    [(ngModel)]="selectedSort"
                    (onChange)="onChange($event)"
                    class="sortBy">
          <ng-template let-item pTemplate="selectedItem">
            <span style="vertical-align:middle">{{item.label}}</span>
          </ng-template>
        </p-dropdown>
      </div>
    </div>

    <!-- Loading state -->
    <div *ngIf="isLoading" class="loading-container">
      <span class="loading">{{'locale.search.searching' | translate}}</span>
    </div>

    <!-- Authors grid -->
    <div class="content-body p-grid"
         infiniteScroll
         [infiniteScrollDistance]="2"
         (scrolled)="onScroll()"
         *ngIf="!isLoading">
      <div class="p-sm-6 p-md-4 p-lg-2 p-xl-1"
           *ngFor="let author of authors; trackBy: trackByAuthorId">

        <div class="user_avatar">
          <img [src]="author.image || './assets/images/avatar3.jpg'"
               class="avatar"
               (click)="showDetails(author)"
               style="cursor: pointer;"
               loading="lazy"
               [alt]="author.name"
               [class.loading-image]="!author.image" />

          <a href="javascript:;"
             (click)="showDetails(author)"
             style="cursor: pointer;"
             tabindex="0"
             (keyup.enter)="showDetails(author)">
            <span class="title">{{author.name}}</span>
            <span class="subtitle">{{author.numBooks}} {{'locale.authors.total' | translate}}</span>
          </a>
        </div>

      </div>
    </div>

    <button type="button"
            pButton
            [ngClass]="'up-button'"
            *ngIf="showGoUpButton"
            (click)="scrollTop()"
            icon="pi pi-arrow-up"
            aria-label="Scroll to top"></button>
  </p-card>
</div>

<div class="book">
  <p-dialog [(visible)]="showDetail"
            [modal]="true"
            [draggable]="false"
            [resizable]="false"
            [transitionOptions]="'150ms'"
            [closeOnEscape]="true">
    <app-author (eventClose)="closeDetails()"
                (eventOpen)="openDetails()"
                (eventBook)="openBook($event)"
                (eventAuthor)="refreshAuthor($event)"></app-author>
  </p-dialog>

  <p-dialog [(visible)]="showBookDetail"
            [modal]="true"
            [draggable]="false"
            [resizable]="false"
            [transitionOptions]="'150ms'"
            [closeOnEscape]="true">
    <app-detail (eventClose)="closeBookDetails()"
                (eventOpen)="openBookDetails()"
                (eventAuthor)="openAuthor($event)"></app-detail>
  </p-dialog>
</div>
