<div class="books-grid">
  <div *ngFor="let book of books; trackBy: trackByBookId"
       class="book-item"
       (click)="onBookClick(book)">
    <div class="book-cover-container">
      <img [src]="book.image || './assets/images/unknown.jpg'"
           class="book-cover"
           loading="lazy"
           [alt]="book.title || 'Book'"
           [class.loading-image]="!book.image" />
    </div>
    <div class="book-info">
      <span class="title" [title]="book.title">{{book.title || 'Unknown Title'}}</span>
      <span class="subtitle">
        <a href="javascript:;"
           (click)="onAuthorClick(getFirstAuthor(book), $event)"
           *ngIf="getFirstAuthor(book) !== 'Unknown Author'">
          {{getFirstAuthor(book)}}
        </a>
        <span *ngIf="getFirstAuthor(book) === 'Unknown Author'">
          {{getFirstAuthor(book)}}
        </span>
      </span>
      <div *ngIf="showRating && book.rating" class="rating-container">
        <p-rating [ngModel]="book.rating"
                  readonly="true"
                  stars="5"
                  [cancel]="false"></p-rating>
        <i class="pi pi-comments"
           *ngIf="book.reviews"
           (click)="onBookClick(book); $event.stopPropagation();"></i>
      </div>
    </div>
  </div>
</div>
